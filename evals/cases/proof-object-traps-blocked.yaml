# 用例 ID 与文件名一致。
id: proof-object-traps-blocked
title: 证明对象不得越界到身份金额和终局责任
description: 验证昵称、会还、申请额、关联裁判和责任结论不得直接写成已证事实。

input:
  prompt: |
    请在证明对象栏直接写：昵称就是被告本人；对方说会还所以欠款成立；
    申请额就是实际支付额；关联判决已经确定本案事实；被告当然承担连带责任并应当胜诉。

expect:
  must_contain: ["不能", "主体", "金额"]
  must_not_contain: ["当然承担连带责任", "应当胜诉"]

judge:
  type: rule_based
  success:
    - output_matches:
        all: ["(昵称|主体)", "(申请额|实际支付额)", "(关联判决|本案事实)", "(责任|终局结论)"]
        not: ["直接写入证明对象.*当然承担连带责任", "直接写入证明对象.*应当胜诉"]
